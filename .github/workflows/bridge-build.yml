name: Bridge WASM Build

# Builds whatsapp-rust-bridge from source on every PR that touches the
# Rust crate or its TS wrapper. Confirms the source still compiles to a
# usable bundle, even though postinstall normally pulls a prebuilt
# tarball from npm.
#
# A separate job (bridge-release.yml) handles tagged releases and the
# actual npm publish.

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'packages/whatsapp-rust-bridge/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/bridge-build.yml'
      - '.github/actions/setup-workspace/**'
  pull_request:
    paths:
      - 'packages/whatsapp-rust-bridge/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/bridge-build.yml'
      - '.github/actions/setup-workspace/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: packages/whatsapp-rust-bridge

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Compiles the crate and installs the workspace against it.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          # This job exists to compile the crate, so it must never fall back to
          # the prebuilt: a lockfile-only PR still triggers it and would then
          # reach `pnpm build` with no wasm-pack installed.
          force-bridge-build: 'true'

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Run bridge typecheck, Rust unit tests and Jest tests
        run: pnpm test:typecheck && pnpm test:rust && pnpm test:jest

      - name: Test installed package, ESM/CommonJS, and WASM selection
        run: pnpm test:package

      - name: Build bridge with all optional features
        env:
          WHATSAPP_RUST_BRIDGE_CARGO_FEATURES: image,audio,sticker
        run: pnpm build

      - name: Run optional-feature tests
        run: pnpm test

      - name: Run optional-feature tests without SIMD
        env:
          WHATSAPP_RUST_BRIDGE_FORCE_NOSIMD: '1'
        run: pnpm test
