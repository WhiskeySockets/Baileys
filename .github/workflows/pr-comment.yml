name: PR Comment

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - unlocked

jobs:
  pr-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: write-all
    steps:
      - uses: actions/checkout@v3

      - uses: mshick/add-pr-comment@v2
        with:
          repo-token: ${{ secrets.PERSONAL_TOKEN }}
          message-id: pr-test
          message: |
            Thanks for opening this pull request and contributing to the project!

            The next step is for the maintainers to review your changes. If everything looks good, it will be approved and merged into the main branch.

            In the meantime, anyone in the community is encouraged to test this pull request and provide feedback.

            ### ✅ How to confirm it works

            If you’ve tested this PR, please comment below with:

            ```
            Tested and working ✅
            ```

            This helps us speed up the review and merge process.

            ### 📦 To test this PR locally:

            ```
            # NPM
            npm install github:${{ github.event.pull_request.head.repo.full_name }}#${{ github.event.pull_request.head.ref }}

            # Yarn (v2+)
            yarn add github:${{ github.event.pull_request.head.repo.full_name }}#${{ github.event.pull_request.head.ref }}

            # PNPM
            pnpm add github:${{ github.event.pull_request.head.repo.full_name }}#${{ github.event.pull_request.head.ref }}
            ```

            If you encounter any issues or have feedback, feel free to comment as well.
